<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>MQTT Control Panel</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { padding: 10px 20px; margin: 5px; }
    .box { margin-bottom: 15px; }
    .status {
      font-weight: bold;
      padding-left: 10px;
    }
    .on { color: green; }
    .off { color: red; }
    img { margin-top: 20px; max-width: 400px; border: 1px solid #ccc; }
  </style>
</head>
<body>

<h2>MQTT Control Panel</h2>

<!-- CAL -->
<div class="box">
  <button onclick="sendCal()">CAL</button>
  <span id="calStatus" class="status">-</span>
</div>

<hr>

<!-- TOILET -->
<div class="box">
  <strong>🚻 ห้องน้ำ</strong><br>
  <button onclick="sendMsg('/th/et1/toilet','ON')">ON</button>
  <button onclick="sendMsg('/th/et1/toilet','OFF')">OFF</button>
  <span id="toiletStatus" class="status">-</span>
</div>

<!-- DORMITORY -->
<div class="box">
  <strong>🛏 ห้องนอน</strong><br>
  <button onclick="sendMsg('/th/et1/dormitory','ON')">ON</button>
  <button onclick="sendMsg('/th/et1/dormitory','OFF')">OFF</button>
  <span id="dormitoryStatus" class="status">-</span>
</div>

<hr>

<h3>🖼 ภาพจาก MQTT</h3>
<img id="img" />

<script>
  const client = mqtt.connect("ws://mqtt.aj-tay.com:8883", {
    username: "cmmc_mqtt",
    password: "cmmc@1234"
  });

  client.on("connect", () => {
    console.log("MQTT Connected");

    client.subscribe([
      "/th/et1/cal",
      "/th/et1/toilet",
      "/th/et1/dormitory",
      "/th/et1/image"
    ]);
  });

  client.on("message", (topic, message) => {
    const msg = message.toString();

    if (topic === "/th/et1/cal") {
      updateStatus("calStatus", msg);
    }

    if (topic === "/th/et1/toilet") {
      updateStatus("toiletStatus", msg);
    }

    if (topic === "/th/et1/dormitory") {
      updateStatus("dormitoryStatus", msg);
    }

    if (topic === "/th/et1/image") {
      document.getElementById("img").src =
        "data:image/jpeg;base64," + msg;
    }
  });

  function sendMsg(topic, msg) {
    client.publish(topic, msg);
  }

  function sendCal() {
    client.publish("/th/et1/cal", "ON");
    updateStatus("calStatus", "ON");

    // ตัวอย่าง cal เสร็จใน 5 วินาที
    setTimeout(() => {
      client.publish("/th/et1/cal", "OFF");
      updateStatus("calStatus", "OFF");
    }, 5000);
  }

  function updateStatus(id, msg) {
    const el = document.getElementById(id);
    el.innerText = msg;
    el.className = "status " + (msg === "ON" ? "on" : "off");
  }
</script>

</body>
</html>
